<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBK LOGISTICS</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .container  { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    iframe      { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <iframe
      id="app"
      allow="geolocation; microphone; camera"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation">
    </iframe>
  </div>

  <script>
    var BASE  = 'https://script.google.com/macros/s/AKfycbxXQrE4yvnoZ83GOHkqNd89R9SbdbdhXG_xL6UoOGTzUJmR9X1U1xS0zCYfC-7m1VN4lw/exec';
    var empId = new URLSearchParams(window.location.search).get('empId') || '';
    document.getElementById('app').src = empId ? BASE + '?empId=' + encodeURIComponent(empId) : BASE;
  </script>
</body>
</html>
